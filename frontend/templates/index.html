<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | PlantDiseaseAI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='v4.css') }}">
<style>
  body{ font-family:'Cairo',sans-serif; }
  .panel{ background:radial-gradient(800px 400px at 80% 0%, #34d39944, transparent),linear-gradient(150deg,#04231f,#075243 55%,#0b7a63); }
  .tab.on{ background:linear-gradient(135deg,#059669,#0d9488); color:#fff; box-shadow:0 12px 24px -14px rgba(5,150,105,.9) }
  .form-sec{ display:none } .form-sec.on{ display:block; animation:fade .35s ease }
  @keyframes fade{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
</style>
</head>
<body class="min-h-screen">
<div class="min-h-screen grid lg:grid-cols-2">

  <!-- الجانب البصري -->
  <aside class="panel hidden lg:flex flex-col justify-between p-12 text-white relative overflow-hidden">
    <a href="/" class="flex items-center gap-3 font-black text-xl">
      <span class="w-11 h-11 rounded-2xl bg-white/15 grid place-items-center text-xl">🌿</span> PlantDiseaseAI
    </a>

    <div class="relative">
      <h1 class="text-4xl font-black leading-tight">تشخيص أمراض النبات<br><span class="text-emerald-300">بذكاء ودقة</span></h1>
      <p class="text-emerald-100/80 mt-4 max-w-md leading-relaxed">
        ارفع صورة ورقة النبتة، واحصل على اسم المرض ونسبة الثقة وخطة العلاج، مع سجل يحفظ كل فحوصاتك.
      </p>
      <div class="mt-8 grid grid-cols-3 gap-3 max-w-md">
        <div class="bg-white/10 rounded-2xl p-3 text-center"><b class="block text-xl">58</b><span class="text-xs text-emerald-100/70">صنف</span></div>
        <div class="bg-white/10 rounded-2xl p-3 text-center"><b class="block text-xl">105K</b><span class="text-xs text-emerald-100/70">صورة</span></div>
        <div class="bg-white/10 rounded-2xl p-3 text-center"><b class="block text-xl">95%+</b><span class="text-xs text-emerald-100/70">دقة</span></div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3 max-w-md">
      <img src="/static/guide/Tomato__Late_blight__before.jpg" alt="" class="rounded-2xl h-32 w-full object-cover opacity-95">
      <img src="/static/guide/Tomato__Late_blight__diseased.jpg" alt="" class="rounded-2xl h-32 w-full object-cover opacity-95">
    </div>
  </aside>

  <!-- نموذج الدخول -->
  <main class="flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white rounded-3xl border border-emerald-100 p-8 shadow-2xl">
      <div class="text-center mb-6">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 grid place-items-center text-2xl text-white shadow-lg">🌱</div>
        <h2 class="text-2xl font-black text-emerald-950 mt-3">مرحباً بك</h2>
        <p class="text-sm text-slate-500 mt-1">سجّل دخولك أو أنشئ حساباً جديداً</p>
      </div>

      <div class="grid grid-cols-3 gap-1 p-1 bg-slate-100 rounded-2xl mb-6 text-sm font-bold">
        <button class="tab on py-2.5 rounded-xl" data-t="login">دخول</button>
        <button class="tab py-2.5 rounded-xl text-slate-600" data-t="register">حساب جديد</button>
        <button class="tab py-2.5 rounded-xl text-slate-600" data-t="forgot">نسيت كلمة المرور</button>
      </div>

      <!-- تسجيل الدخول -->
      <form id="login" class="form-sec on space-y-4" action="/home" method="POST" autocomplete="off">
        <div>
          <label class="text-sm font-bold text-slate-700">البريد الإلكتروني</label>
          <input type="email" name="email" required placeholder="example@mail.com" class="w-full mt-1.5 px-4 py-3 text-sm">
        </div>
        <div>
          <label class="text-sm font-bold text-slate-700">كلمة المرور</label>
          <input type="password" name="password" required placeholder="••••••••" class="w-full mt-1.5 px-4 py-3 text-sm">
        </div>
        <button type="submit" class="w-full py-3.5 text-sm">دخول</button>
      </form>

      <!-- حساب جديد -->
      <form id="register" class="form-sec space-y-4" action="/register" method="POST" autocomplete="off">
        <div>
          <label class="text-sm font-bold text-slate-700">الاسم</label>
          <input type="text" name="name" required placeholder="الاسم الكامل" class="w-full mt-1.5 px-4 py-3 text-sm">
        </div>
        <div>
          <label class="text-sm font-bold text-slate-700">البريد الإلكتروني</label>
          <input type="email" name="email" required placeholder="example@mail.com" class="w-full mt-1.5 px-4 py-3 text-sm">
        </div>
        <div>
          <label class="text-sm font-bold text-slate-700">كلمة المرور</label>
          <input type="password" name="password" required placeholder="••••••••" class="w-full mt-1.5 px-4 py-3 text-sm">
        </div>
        <button type="submit" class="w-full py-3.5 text-sm">إنشاء الحساب</button>
      </form>

      <!-- استعادة كلمة المرور -->
      <form id="forgot" class="form-sec space-y-4" action="/forgot-password" method="POST" autocomplete="off">
        <div>
          <label class="text-sm font-bold text-slate-700">البريد الإلكتروني</label>
          <input type="email" name="email" required placeholder="example@mail.com" class="w-full mt-1.5 px-4 py-3 text-sm">
        </div>
        <div>
          <label class="text-sm font-bold text-slate-700">كلمة المرور الجديدة</label>
          <input type="password" name="new_password" required placeholder="••••••••" class="w-full mt-1.5 px-4 py-3 text-sm">
        </div>
        <button type="submit" class="w-full py-3.5 text-sm">تحديث كلمة المرور</button>
      </form>

      <div class="mt-6 pt-5 border-t border-slate-100 flex items-center justify-between text-xs">
        <a href="/" class="text-emerald-700 font-bold hover:underline">← العودة للرئيسية</a>
        <a href="/guide_page" class="text-slate-500 font-bold hover:text-emerald-700">دليل الأمراض</a>
      </div>
    </div>
  </main>
</div>

<script>
  // تبديل بين تسجيل الدخول / حساب جديد / استعادة كلمة المرور
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => {
        b.classList.remove('on');
        b.classList.add('text-slate-600');
      });
      btn.classList.add('on');
      btn.classList.remove('text-slate-600');
      document.querySelectorAll('.form-sec').forEach(f => f.classList.remove('on'));
      document.getElementById(btn.dataset.t).classList.add('on');
    });
  });
</script>
</body>
</html>
